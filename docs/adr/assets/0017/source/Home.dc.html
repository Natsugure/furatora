<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ふらとら トップ</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>

a{color:#C63D71}a:hover{color:#A02F5B}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; background: #FAF6F7; color: #2A2326; font-family: 'Noto Sans JP', sans-serif; letter-spacing: 0.02em; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true" style="display: block"><rect width="100" height="100" rx="22" fill="#DF5286"/><g transform="translate(50 50) scale(1.1) translate(-50 -35)"><rect x="31" y="10" width="38" height="38" rx="10" fill="#FFFFFF"/><rect x="36" y="16" width="28" height="14" rx="3.5" fill="#DF5286"/><circle cx="39" cy="40" r="3" fill="#DF5286"/><circle cx="61" cy="40" r="3" fill="#DF5286"/><path d="M38 48 L35 56 M62 48 L65 56" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path d="M12 60 H88" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/></g></svg>
      <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 20px">ふらとら</span>
    </div>
    <button type="button" aria-label="ふらとらについて" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: #FFFFFF; color: #7A6E72; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(110,33,64,0.06)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
  </header>

  <div style="padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 500; color: #7A6E72">ベビーカー・車いすでの乗り換えを、やさしく</div>
      <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.3"><span style="color: #DF5286">どの駅</span>へ<br>行きますか？</h1>
    </div>

    <div style="display: flex; padding: 4px; border-radius: 999px; background: #F1EAED">
      <button type="button" style="flex: 1; height: 44px; border: none; border-radius: 999px; background: #FFFFFF; color: #C63D71; font-family: 'Noto Sans JP', sans-serif; font-weight: 700; font-size: 14px; box-shadow: 0 2px 8px rgba(110,33,64,0.10)">駅名で探す</button>
      <button type="button" style="flex: 1; height: 44px; border: none; border-radius: 999px; background: transparent; color: #4A4044; font-family: 'Noto Sans JP', sans-serif; font-weight: 500; font-size: 14px">路線から探す</button>
    </div>

    <label style="display: flex; align-items: center; gap: 12px; height: 58px; padding: 0 20px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 6px 20px rgba(110,33,64,0.08); color: #C63D71">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">駅名</span>
      <input type="text" placeholder="駅名で検索（例：茅場町）" style="flex: 1; min-width: 0; border: none; background: transparent; font-family: 'Noto Sans JP', sans-serif; font-size: 16px; color: #2A2326; outline: none">
    </label>
  </div>

  <section style="flex: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 -4px 24px rgba(110,33,64,0.05)">

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 18px">ふらとらでわかること</h2>
      <p style="margin: 0; font-size: 13px; color: #7A6E72; line-height: 1.7">各駅のバリアフリー設備と、車内のフリースペース・優先席の位置を図で確認できます。</p>
    </div>

    <div style="display: flex; flex-direction: column; position: relative">
      <div style="position: absolute; left: 25px; top: 52px; bottom: 52px; border-left: 2.5px dashed #F5C5D6"></div>

      <div style="display: flex; align-items: center; gap: 16px; padding: 10px 0; position: relative">
        <span style="width: 52px; height: 52px; border-radius: 999px; background: #DF5286; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 16px">バリアフリー対応の乗り換えルート</span><span style="font-size: 13px; color: #7A6E72">他社線同士の乗り換えも案内</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 10px 0; position: relative">
        <span style="width: 52px; height: 52px; border-radius: 999px; background: #F4EFF1; color: #DF5286; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 10l3-3 3 3M9 14l3 3 3-3"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 16px">ホームの出口・乗り換え設備</span><span style="font-size: 13px; color: #7A6E72">エレベーター・階段の位置を図で表示</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 10px 0; position: relative">
        <span style="width: 52px; height: 52px; border-radius: 999px; background: #F4EFF1; color: #DF5286; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v9h8l2 6M7 13l-1.5 6M10 9h5"/><circle cx="7" cy="2.6" r=".6"/></svg></span>
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 16px">フリースペース・優先席</span><span style="font-size: 13px; color: #7A6E72">車内のどこにあるかを図で表示</span></span>
      </div>
    </div>

    <div style="height: 1px; background: #F4EFF1"></div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 16px">対応している事業者</h2>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <div style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px 0 8px; border-radius: 999px; background: #F4EFF1; font-size: 14px; font-weight: 500"><span style="width: 24px; height: 24px; border-radius: 999px; background: #009BBF; display: block"></span>東京メトロ</div>
        <div style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px 0 8px; border-radius: 999px; background: #F4EFF1; font-size: 14px; font-weight: 500"><span style="width: 24px; height: 24px; border-radius: 999px; background: #3DAE3A; display: block"></span>東京都交通局</div>
      </div>
      <p style="margin: 0; font-size: 12px; color: #7A6E72">※今後、首都圏を中心に追加予定です。</p>
    </div>
  </section>
</div>
</x-dc>
