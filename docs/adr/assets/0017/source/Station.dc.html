<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>池袋駅の詳細</title>
<script src="./preview.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C63D71}a:hover{color:#A02F5B}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; background: #FAF6F7; color: #2A2326; font-family: 'Noto Sans JP', sans-serif; letter-spacing: 0.02em; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 20px">
    <a href="Line.dc.html" aria-label="戻る" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #4A4044; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(110,33,64,0.06)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="width: 62px; height: 62px; border-radius: 999px; box-sizing: border-box; border: 5px solid #E60012; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; line-height: 1; flex-shrink: 0"><span style="font-size: 12px">M</span><span style="font-size: 20px">25</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.2">池袋</h1>
        <div style="font-size: 13px; color: #7A6E72">Ikebukuro</div>
      </div>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap">
      <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 4px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 500"><span style="width: 22px; height: 22px; border-radius: 999px; background: #E60012; color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center">M</span>丸ノ内線</span>
      <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 4px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 500"><span style="width: 22px; height: 22px; border-radius: 999px; background: #A8904F; color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center">Y</span>有楽町線</span>
      <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px 0 4px; border-radius: 999px; background: #FFFFFF; font-size: 12px; font-weight: 500"><span style="width: 22px; height: 22px; border-radius: 999px; background: #9C5E31; color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center">F</span>副都心線</span>
    </div>
  </header>

  <section style="flex: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 28px 20px 32px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 -4px 24px rgba(110,33,64,0.05)">

    <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 18px">乗り換えのバリアフリールート</h2>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 500; color: #7A6E72">乗り換え先の路線</span>
      <span style="position: relative; display: block">
        <select style="width: 100%; height: 54px; padding: 0 44px 0 18px; border: none; border-radius: 16px; background: #FAF6F7; box-shadow: inset 0 0 0 1.5px #EBE4E7; font-family: 'Noto Sans JP', sans-serif; font-size: 16px; color: #2A2326; appearance: none">
          <option>東京メトロ副都心線</option>
          <option>東京メトロ有楽町線</option>
        </select>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C63D71" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 18px; top: 18px; pointer-events: none"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </label>

    <div role="group" aria-label="移動手段" style="display: flex; padding: 4px; border-radius: 999px; background: #F4EFF1">
      <button type="button" onClick="{{pickStroller}}" aria-pressed="{{isStroller}}" style="flex: 1; height: 46px; border: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; {{strollerTab}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="19.5" r="1.7"/><circle cx="17" cy="19.5" r="1.7"/><path d="M3 4h2.5l2 10h11.5"/><path d="M11 4a8 8 0 0 1 8 10"/><path d="M11 4v10"/></svg>ベビーカー
      </button>
      <button type="button" onClick="{{pickWheel}}" aria-pressed="{{isWheel}}" style="flex: 1; height: 46px; border: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; {{wheelTab}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="3.8" r="1.6"/><path d="M10 7v6h6l2.5 5.5"/><path d="M10 10h5"/><path d="M7.5 11a5.5 5.5 0 1 0 7.8 6.6"/></svg>車いす
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px; border-radius: 22px; background: {{cardBg}}">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 26px; height: 26px; border-radius: 999px; border: 2.5px solid #4E9A7A; box-sizing: border-box; box-shadow: inset 0 0 0 3px {{cardBg}}, inset 0 0 0 7px #4E9A7A; flex-shrink: 0"></span>
        <span style="font-weight: 700; font-size: 15px; color: #2F6E54">バリアフリールートあり</span>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; color: #7A6E72">経路</span>
          <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.4">改札内<br>乗換連絡通路経由</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
          <span style="font-size: 12px; color: #7A6E72">所要時間</span>
          <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 40px; line-height: 1; color: {{accentText}}">5<span style="font-size: 16px; margin-left: 2px">分</span></span>
        </div>
      </div>
      <div style="height: 1px; background: rgba(42,35,38,0.08)"></div>
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
        <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 10px; background: #FFFFFF; color: {{accentText}}; font-size: 12px; font-weight: 700"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>そのまま通れる</span>
        <span style="font-size: 12px; color: #4A4044">一般的なルートと同じ所要時間です</span>
      </div>
    </div>

    <div style="display: flex; gap: 12px; padding: 16px 18px; border-radius: 22px; background: #FAF6F7; color: #4A4044">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C63D71" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <p style="margin: 0; font-size: 13px; line-height: 1.75">エレベーターの位置を参考に、乗車位置を事前に確認しておくと、スムーズに移動できます。</p>
    </div>

    <div style="height: 1px; background: #F4EFF1"></div>

    <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 18px">ホーム</h2>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 18px; border-radius: 22px; box-shadow: inset 0 0 0 1.5px #F4EFF1">
      <div style="display: flex; align-items: center; gap: 14px">
        <span style="width: 48px; height: 48px; border-radius: 999px; background: #E60012; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 22px; flex-shrink: 0">2</span>
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 18px">2番線 <span style="font-size: 13px; font-weight: 500; color: #7A6E72; font-family: 'Noto Sans JP', sans-serif">丸ノ内線 · 6両編成</span></span>
          <span style="font-size: 13px; color: #4A4044">東京・新宿・荻窪・方南町方面</span>
        </span>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 10px; background: #FBF3D2; color: #6B5A0E; font-size: 12px; font-weight: 700">出口 2か所</span>
        <span style="display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 10px; background: #FAE3EB; color: #A02F5B; font-size: 12px; font-weight: 700">フリースペース 6か所</span>
      </div>
      <a href="Platform.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 999px; background: #C63D71; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 15px">ホーム図を見る<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'stroller' };
  }
  renderVals() {
    const isStroller = this.state.mode === 'stroller';
    const on = 'background: #FFFFFF; font-weight: 700; box-shadow: 0 2px 8px rgba(110,33,64,0.10);';
    const off = 'background: transparent; font-weight: 500; color: #4A4044;';
    return {
      isStroller: isStroller,
      isWheel: !isStroller,
      strollerTab: isStroller ? on + ' color: #C63D71;' : off,
      wheelTab: isStroller ? off : on + ' color: #3F5F82;',
      cardBg: isStroller ? '#FDF3F6' : '#EEF3F8',
      accentText: isStroller ? '#C63D71' : '#3F5F82',
      pickStroller: () => this.setState({ mode: 'stroller' }),
      pickWheel: () => this.setState({ mode: 'wheelchair' })
    };
  }
}
</script>
</body>
</html>
