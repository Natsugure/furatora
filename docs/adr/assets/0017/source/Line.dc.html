<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>銀座線の駅一覧</title>
<script src="./preview.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2A2326;text-decoration:none}a:hover{color:#A02F5B}
</style>
</helmet>
<div style="width: 390px; height: 1120px; box-sizing: border-box; background: #FAF6F7; color: #2A2326; font-family: 'Noto Sans JP', sans-serif; letter-spacing: 0.02em; display: flex; flex-direction: column; overflow: hidden">

  <header style="padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 20px">
    <a href="Home.dc.html" aria-label="戻る" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; color: #4A4044; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(110,33,64,0.06)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="width: 60px; height: 60px; border-radius: 999px; background: {{lineColor}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 28px; flex-shrink: 0">G</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: 13px; font-weight: 500; color: #7A6E72">東京メトロ</div>
        <h1 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.25">銀座線</h1>
        <div style="font-size: 13px; color: #7A6E72">Ginza Line · 全19駅</div>
      </div>
    </div>
  </header>

  <section style="flex: 1; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -4px 24px rgba(110,33,64,0.05)">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 4px 0">
      <h2 style="margin: 0; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 16px">駅をえらぶ</h2>
      <div style="font-size: 12px; color: #7A6E72">渋谷 → 浅草</div>
    </div>

    <div style="position: relative; display: flex; flex-direction: column">
      <div style="position: absolute; left: 24px; top: 30px; bottom: 30px; width: 5px; border-radius: 999px; background: {{lineColor}}; opacity: 0.55"></div>
      <sc-for list="{{stations}}" as="s" hint-placeholder-count="8">
        <a href="Station.dc.html" style="position: relative; display: flex; align-items: center; gap: 16px; min-height: 92px; padding: 8px 0">
          <span style="width: 54px; height: 54px; border-radius: 999px; box-sizing: border-box; border: 4px solid {{lineColor}}; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; line-height: 1; flex-shrink: 0"><span style="font-size: 11px">G</span><span style="font-size: 17px">{{s.no}}</span></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
            <span style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 19px">{{s.name}}</span><span style="font-size: 12px; color: #7A6E72">{{s.roman}}</span></span>
            <sc-if value="{{s.hasTransfer}}" hint-placeholder-val="{{true}}">
              <span style="display: flex; gap: 6px; flex-wrap: wrap">
                <sc-for list="{{s.transfers}}" as="t" hint-placeholder-count="2">
                  <span style="display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 3px; border-radius: 999px; background: #F4EFF1; font-size: 11px; color: #4A4044"><span style="width: 18px; height: 18px; border-radius: 999px; background: {{t.color}}; color: #FFFFFF; font-family: 'Zen Maru Gothic', sans-serif; font-weight: 700; font-size: 10px; display: flex; align-items: center; justify-content: center">{{t.mark}}</span>{{t.name}}</span>
                </sc-for>
              </span>
            </sc-if>
          </span>
          <span style="width: 30px; height: 30px; border-radius: 999px; border: 2px solid #EE9FBA; box-sizing: border-box; color: #C63D71; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
        </a>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lineColor":{"editor":"color","default":"#F39700","options":["#F39700","#E60012","#9C5E31","#00BB85"]},"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const Z = { mark: 'Z', name: '半蔵門線', color: '#8F76D6' };
    const F = { mark: 'F', name: '副都心線', color: '#9C5E31' };
    const C = { mark: 'C', name: '千代田線', color: '#00A06B' };
    const E = { mark: 'E', name: '大江戸線', color: '#CE045B' };
    const M = { mark: 'M', name: '丸ノ内線', color: '#E60012' };
    const N = { mark: 'N', name: '南北線', color: '#00A08C' };
    const A = { mark: 'A', name: '浅草線', color: '#E85298' };
    const list = [
      { no: '01', name: '渋谷', roman: 'Shibuya', transfers: [Z, F] },
      { no: '02', name: '表参道', roman: 'Omote-sando', transfers: [Z, C] },
      { no: '03', name: '外苑前', roman: 'Gaiemmae', transfers: [] },
      { no: '04', name: '青山一丁目', roman: 'Aoyama-itchome', transfers: [Z, E] },
      { no: '05', name: '赤坂見附', roman: 'Akasaka-mitsuke', transfers: [M] },
      { no: '06', name: '溜池山王', roman: 'Tameike-sanno', transfers: [N] },
      { no: '07', name: '虎ノ門', roman: 'Toranomon', transfers: [] },
      { no: '08', name: '新橋', roman: 'Shimbashi', transfers: [A] }
    ];
    return {
      lineColor: this.props.lineColor ?? '#F39700',
      stations: list.map((s) => ({ ...s, hasTransfer: s.transfers.length > 0 }))
    };
  }
}
</script>
</body>
</html>
