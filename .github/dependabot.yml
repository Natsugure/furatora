version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm の minimumReleaseAge（3日）とそろえる。
    cooldown:
      default-days: 3
    # Issue で移行を管理しているメジャー版は PR にしない。移行を終えたら外す
    ignore:
      # #229（ESLint 10）
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # #230（vitest 5・Vite 8・plugin-react 6 はまとめて上げる。別々に上げると版の制約にぶつかる）
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # #240（Mantine 9。core・hooks・notifications は互いに同じ版を peer に求めるので、まとめて上げる）
      - dependency-name: "@mantine/*"
        update-types: ["version-update:semver-major"]
      # 以下は Issue で管理しない、外す条件が決まっている除外
      # @types/node は実行環境の Node（engines: 24.x）に合わせる。Node を上げるときに外す
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7（Go 版）は JS API を持たず、typescript-eslint などが追いつくまで見送る。
      # 7 への橋渡しになる 6.x は受け取る
      - dependency-name: typescript
        versions: [">=7"]
    # メジャー版の更新は、まとめずに1つずつ PR にする
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # npm と同じく、メジャー版の更新はまとめずに1つずつ PR にする
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
