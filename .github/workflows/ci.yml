# PR ごとに lint・型チェック・テストを回す。
# これまで型検査は Vercel の `next build` 頼みで、PR 上の保証が無かった（Issue #50）。
# DB 接続は不要: Route Handler のテストは @furatora/database をモックしている。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      # web/admin の typecheck は `next typegen` を前置している（package.json 参照）。
      # `next-env.d.ts` と `.next/types/**` は .gitignore 対象で、tsconfig の include が
      # それらを指すため、クリーンチェックアウトのままでは静的アセットや Route/Page の
      # 型宣言が解決できない。typegen を外すとここが必ず落ちる。
      - run: pnpm run typecheck

      - run: pnpm run test
