packages:
  - 'apps/*'
  - 'packages/*'

# ----------------------------------------------------------------------------
# 2つ以上のパッケージで使う依存の版 (ADR-0027)
# ----------------------------------------------------------------------------
# 各 package.json では "catalog:" と書く。版は ^ を付けずに固定する (ADR-0026)。
# 1つのパッケージでしか使わない依存と peerDependencies は、ここに入れない。
catalog:
  # フレームワーク
  next: 16.4.6
  # web だけで使うが、next と同じ版にそろえるため一緒に置く
  "@next/third-parties": 16.4.6
  react: 19.3.1
  react-dom: 19.3.1
  "@mantine/core": 8.3.18
  "@mantine/hooks": 8.3.18
  # admin だけで使うが、@mantine/core・@mantine/hooks と同じ版を peer に求めるため一緒に置く
  "@mantine/notifications": 8.3.18
  lucide-react: 1.75.0
  tailwindcss: 4.3.5
  "@tailwindcss/postcss": 4.3.5
  # DB
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  # 型
  typescript: 5.9.3
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # lint
  eslint: 9.39.5
  # next と同じ版にそろえる
  eslint-config-next: 16.4.6
  # テスト
  vitest: 4.1.12
  "@vitejs/plugin-react": 5.2.0
  jsdom: 31.0.1
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.10
  # スクリプトの実行
  tsx: 4.23.15

overrides:
  # vitest 4.1.12 の配下の vite 7.3.1 に脆弱性があり、pnpm update では配下まで上がらないため、7 系の修正版に引き上げる。
  # vitest 5・Vite 8 へ移行するときに外す
  "vite@7": 7.3.7

minimumReleaseAge: 4320
# 3日を待てない修正版だけを「名前@版」で載せ、理由・載せた日・外す日をコメントで書く
minimumReleaseAgeExclude: []

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
# 30日の内側で trustPolicy に止まった版を入れるときだけ「名前@版」で載せ、理由をコメントで書く
trustPolicyExclude: []

# pnpm audit で high 以上でも直せないものだけを GHSA の ID で載せ、理由・解消の条件・見直しの期限をコメントで書く (ADR-0028)
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7 の ReDoS（細工した extglob で処理が極端に遅くなる）。修正版が無い（2026-11-18 時点で最新が 4.0.7）。
    # eslint-config-next の配下（開発用の lint）にしかなく、glob パターンは自分で書いた設定からしか渡らないため悪用されない。
    # 解消の条件: picomatch の修正版が出て、配下まで上がったら外す。見直しの期限: 2026-12-18
    - GHSA-fc5q-39xc-vjpf

savePrefix: ""
catalogMode: strict
blockExoticSubdeps: true
strictDepBuilds: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
onlyBuiltDependencies:
  - esbuild
